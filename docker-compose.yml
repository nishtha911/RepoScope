services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: reposcope
      POSTGRES_USER: reposcope
      POSTGRES_PASSWORD: reposcope
    ports:
      - "5432:5432"
    volumes:
      - reposcope-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reposcope -d reposcope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reposcope-postgres: