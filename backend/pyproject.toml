[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcope-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "networkx>=3.2",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["black>=24.10", "httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]